 o.items.forEach(i=>{wrap(i.q+"x "+a(i.n),W).forEach(x=>L.push(x));if(i.tp)wrap("  + "+a(i.tp),W).forEach(x=>L.push(x));L.push(r("",rp(i.q*i.h)))});
 L.push(ln,r("Subtotal",rp(o.sub||o.total)));if(o.disc)L.push(r("Diskon","-"+rp(o.disc)));if(o.ship)L.push(r("Ongkir",rp(o.ship)));
 L.push(r("TOTAL",rp(o.total)),r("Bayar",o.pay||""));if(o.cash)L.push(r("Tunai",rp(o.cash)),r("Kembali",rp(o.cash-o.total)));
 L.push(ln,c("Terima kasih!"),c("Lezatnya Roti Bakar,"),c("Hangatnya Kebersamaan."));return L}
async function findC(g){for(const sv of await g.getPrimaryServices())for(const ch of await sv.getCharacteristics())if(ch.properties.write||ch.properties.writeWithoutResponse)return ch;return null}
async function btConn(){if(!navigator.bluetooth)return toast("Bluetooth tidak didukung. Buka dengan Chrome di Android.");
 try{const d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[0xff00,0xffe0,0xfee7,0x18f0,"49535343-fe7d-4ae5-8fa9-9fafd205e455","e7810a71-73ae-499d-8c15-faa9aef0c3f2"]});
 S.btd=d;S.btc=await findC(await d.gatt.connect());if(!S.btc)return toast("Printer ini tidak dikenali");toast("Printer tersambung: "+(d.name||""));render()}catch(e){toast("Gagal menyambung printer")}}
async function btSend(L){if(S.btd&&!S.btd.gatt.connected)S.btc=await findC(await S.btd.gatt.connect());
 const u=new Uint8Array([0x1b,0x40,...new TextEncoder().encode(L.join("\n")+"\n\n\n\n")]);
 for(let i=0;i<u.length;i+=100){const ch=u.slice(i,i+100);S.btc.properties.writeWithoutResponse?await S.btc.writeValueWithoutResponse(ch):await S.btc.writeValue(ch);await new Promise(r=>setTimeout(r,30))}}
function webPrint(L){let e=$("#pr");if(!e){e=document.createElement("pre");e.id="pr";document.body.appendChild(e)}e.textContent=L.join("\n");let st=$("#ps");if(!st){st=document.createElement("style");st.id="ps";document.head.appendChild(st)}
 const w=S.set.paper==80?"80mm":"58mm";st.textContent=`#pr{display:none}@media print{@page{size:${w} auto;margin:0}body>*:not(#pr){display:none!important}#pr{display:block;width:${w};margin:0;padding:2mm;font:${S.set.paper==80?12:11}px/1.25 monospace;color:#000;background:#fff}}`;print()}
async function pr(o){const L=notaLines(o);if(S.btc){try{await btSend(L);return toast("Nota dicetak")}catch(e){toast("Printer Bluetooth gagal, memakai cetak biasa")}}webPrint(L)}
